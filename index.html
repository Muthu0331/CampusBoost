<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusBoost</title>
</head>

<body>

  <h1>CampusBoost</h1>

  <h2>College & Career Starter eBook</h2>

  <p>Practical career guide for college students.</p>

  <h2>₹99</h2>

  <button id="buyButton" onclick="startPayment()">
    Buy Now
  </button>

  <p id="message"></p>

  <script>
    async function startPayment() {
      const button = document.getElementById("buyButton");
      const message = document.getElementById("message");

      button.disabled = true;
      message.innerText = "Creating payment...";

      try {
        const response = await fetch("/api/create-order", {
          method: "POST"
        });

        const data = await response.json();

        console.log(data);

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "Payment creation failed"
          );
        }

        message.innerText =
          "Payment order created successfully!";

      } catch (error) {
        console.error(error);

        message.innerText =
          "Payment failed: " + error.message;

      } finally {
        button.disabled = false;
      }
    }
  </script>

</body>
</html>
